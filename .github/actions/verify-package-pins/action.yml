name: verify-package-pins
description: Check that external Kurtosis package versions are pinned only in the replace block of kurtosis.yml.

runs:
  using: composite
  steps:
    - name: Install pyyaml
      shell: bash
      run: pip install pyyaml

    - name: Verify external package pins
      shell: bash
      run: python3 "${{ github.action_path }}/verify-package-pins.py"

    - name: Check the pre-pulled genesis generator matches ethereum-package
      shell: bash
      run: bash "${GITHUB_ACTION_PATH}/check-pull-images.sh"
