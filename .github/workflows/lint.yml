# Reusable lint checks for Kurtosis packages. Each check is a separate job so that failures
# are reported independently. The Kurtosis, markdown, typos and shfmt checks run by default, an
# empty value (or `false`) turns a check off; the python check only runs when the repository has Python files.
name: lint

on:
  workflow_call:
    inputs:
      kurtosis_version:
        description: Kurtosis CLI version used by `kurtosis lint`, empty to skip the check.
        type: string
        default: 1.23.0
      markdown_paths:
        description: Paths checked by rumdl, empty to skip the check.
        type: string
        default: .
      python_paths:
        description: Paths checked by ruff, empty to skip the check. The check is also skipped when the repository has no Python file.
        type: string
        default: .
      python_version:
        description: Python version used by the ruff check.
        type: string
        default: "3.13"
      ruff_version:
        description: ruff release installed by the python check.
        type: string
        default: 0.14.3
      typos:
        description: Run typos.
        type: boolean
        default: true
      shfmt_version:
        description: shfmt release used to check shell formatting, empty to skip the check.
        type: string
        default: 3.13.1
      timeout_minutes:
        description: Timeout of each job.
        type: number
        default: 5

permissions: {}

jobs:
  kurtosis:
    if: inputs.kurtosis_version != ''
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout_minutes }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Install kurtosis
        env:
          KURTOSIS_VERSION: ${{ inputs.kurtosis_version }}
        run: |
          echo "deb [trusted=yes] https://sdk.kurtosis.com/kurtosis-cli-release-artifacts/ /" | sudo tee /etc/apt/sources.list.d/kurtosis.list
          sudo apt update
          sudo apt install -y "kurtosis-cli=${KURTOSIS_VERSION}"
          kurtosis analytics disable

      - name: Run kurtosis linter
        run: kurtosis lint .

  markdown:
    if: inputs.markdown_paths != ''
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout_minutes }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Run rumdl
        uses: rvben/rumdl@ba563d6780c6119bd526c869a730b492c1ad54e5 # v0.3.5
        with:
          path: ${{ inputs.markdown_paths }}

  python:
    if: inputs.python_paths != ''
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout_minutes }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Detect Python files
        id: detect
        run: |
          if [[ -n "$(git ls-files '*.py' | head -n 1)" ]]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.detect.outputs.found == 'true'
        uses: actions/setup-python@v7.1.0
        with:
          python-version: ${{ inputs.python_version }}

      - name: Run ruff
        if: steps.detect.outputs.found == 'true'
        env:
          RUFF_VERSION: ${{ inputs.ruff_version }}
          PYTHON_PATHS: ${{ inputs.python_paths }}
        run: |
          pip install "ruff==${RUFF_VERSION}"
          read -ra paths <<< "${PYTHON_PATHS}"
          ruff check "${paths[@]}"

  typos:
    if: inputs.typos
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout_minutes }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: crate-ci/typos@276087d9a4f06398b3e04825487805e2d7375888 # v1.52.2

  shfmt:
    if: inputs.shfmt_version != ''
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout_minutes }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: mfinelli/setup-shfmt@a25fda4c1fe115aec0f85e04126610841bc3141d # v4.0.1
        with:
          shfmt-version: ${{ inputs.shfmt_version }}

      - name: Run shfmt
        run: shfmt -d .
