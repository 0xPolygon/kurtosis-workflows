# Reusable Slack recap of a workflow run: one line, linking each failed or cancelled job.
name: workflow-summary

on:
  workflow_call:
    inputs:
      name:
        description: Name shown in the message and used as its link text, e.g. "Kurtosis CDK Nightly".
        type: string
        required: true
      needs:
        description: toJSON(needs) of the calling job, i.e. the jobs the summary covers.
        type: string
        required: true
      slack_channel_id:
        description: Slack channel the message is posted to.
        type: string
        default: C04DS0SG599
      success_text:
        description: Status when every job succeeded.
        type: string
        default: all tests passed ✅
      failure_text:
        description: Status when a job failed.
        type: string
        default: some tests failed ❌
      skipped_text:
        description: Status when a job was cancelled or skipped.
        type: string
        default: some tests were skipped ⚠️
    secrets:
      slack_bot_token:
        description: Slack bot token allowed to post in the channel.
        required: true

permissions: {}

jobs:
  summary:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
    steps:
      - name: Build the Slack message
        id: message
        env:
          GH_TOKEN: ${{ github.token }}
          NEEDS: ${{ inputs.needs }}
          NAME: ${{ inputs.name }}
          SUCCESS_TEXT: ${{ inputs.success_text }}
          FAILURE_TEXT: ${{ inputs.failure_text }}
          SKIPPED_TEXT: ${{ inputs.skipped_text }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          JOBS_API: repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/attempts/${{ github.run_attempt }}/jobs
        run: |
          # Links are a bonus: an API error must not cost the Slack message.
          jobs=$(gh api --paginate "$JOBS_API" --jq '.jobs[]') || jobs=""

          status=$(jq -r --arg ok "$SUCCESS_TEXT" --arg ko "$FAILURE_TEXT" --arg skipped "$SKIPPED_TEXT" \
            '[.[].result]
              | if index("failure") then $ko
                elif index("cancelled") or index("skipped") then $skipped
                else $ok end' <<< "$NEEDS")
          # Per matrix leg, so the link lands on the leg that broke.
          broken=$(jq -rs '[.[] | select(.conclusion == "failure" or .conclusion == "cancelled")
            | "<\(.html_url)|\(.name)>"] | join(", ")' <<< "$jobs")
          [[ -n "$broken" ]] && status+=" ($broken)"

          echo "text=<$RUN_URL|$NAME>: $status" >> "$GITHUB_OUTPUT"

      - uses: slackapi/slack-github-action@dcb1066f776dd043e64d0e8ba94ca15cc7e1875d # v4.0.0
        with:
          token: ${{ secrets.slack_bot_token }}
          method: chat.postMessage
          payload: |
            {
              "channel": ${{ toJSON(inputs.slack_channel_id) }},
              "text": ${{ toJSON(format('{0} - Test Summary', inputs.name)) }},
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": ${{ toJSON(steps.message.outputs.text) }}
                  }
                }
              ]
            }
