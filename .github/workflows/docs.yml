# Reusable build (and optional GitHub Pages deployment) of a Docusaurus-style npm website.
name: docs

on:
  workflow_call:
    inputs:
      node_version:
        description: Node.js version used to build the website.
        type: string
        default: 24.22.1
      docs_dir:
        description: Directory of the website, holding package.json and package-lock.json.
        type: string
        default: docs
      build_dir:
        description: Build output directory, relative to docs_dir.
        type: string
        default: build
      typecheck:
        description: Run `npm run typecheck` before the build, when the website defines it.
        type: boolean
        default: true
      deploy:
        description: Deploy the build to GitHub Pages on pushes to the default branch.
        type: boolean
        default: true
      build_timeout_minutes:
        description: Timeout of the build job.
        type: number
        default: 10
      deploy_timeout_minutes:
        description: Timeout of the deploy job.
        type: number
        default: 15

permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.build_timeout_minutes }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: ${{ inputs.node_version }}
          cache: npm
          cache-dependency-path: ${{ inputs.docs_dir }}/package-lock.json

      - name: Install dependencies
        working-directory: ${{ inputs.docs_dir }}
        run: npm ci

      - name: Typecheck
        if: inputs.typecheck
        working-directory: ${{ inputs.docs_dir }}
        run: npm run typecheck --if-present

      - name: Build website
        working-directory: ${{ inputs.docs_dir }}
        run: npm run build

      - name: Upload build artifact
        if: inputs.deploy && github.event_name == 'push' && github.ref_name == github.event.repository.default_branch
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: ${{ inputs.docs_dir }}/${{ inputs.build_dir }}

  deploy:
    if: inputs.deploy && github.event_name == 'push' && github.ref_name == github.event.repository.default_branch
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.deploy_timeout_minutes }}
    permissions:
      pages: write # deploy to Pages
      id-token: write # verify the deployment originates from an appropriate source
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5.0.1
